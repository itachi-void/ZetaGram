services:
  zetagram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zetagram_bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/bot.db}
      - PERSISTENCE_FILE=${PERSISTENCE_FILE:-/app/data/bot_persistence.pickle}
    volumes:
      - zetagram_data:/app/data
    # If running with Telegram Webhook instead of polling, uncomment the port:
    # ports:
    #   - "${WEBHOOK_PORT:-8080}:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: zetagram_postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zetagram}
      POSTGRES_USER: ${POSTGRES_USER:-zetagram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zetagram}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zetagram_data:
    driver: local
  postgres_data:
    driver: local
